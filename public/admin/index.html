<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Administración · Aguilera</title>
    <style>
      :root {
        --papel: #f7f6f1;
        --tinta: #101417;
        --grafito: #5b6266;
        --linea: #cdc8ba;
        --senal: #c23a1f;
        --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        --sans: system-ui, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--papel);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 15px;
      }
      button, input, textarea, select { font: inherit; }
      .oculto { display: none !important; }
      .barra {
        position: sticky; top: 0; z-index: 5;
        display: flex; align-items: center; gap: 16px;
        padding: 12px 20px;
        background: var(--papel);
        border-bottom: 1px solid var(--linea);
      }
      .barra strong { font-size: 16px; letter-spacing: -0.02em; }
      .barra__estado { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--grafito); }
      .btn {
        border: 1px solid var(--tinta); background: transparent; color: var(--tinta);
        padding: 8px 14px; cursor: pointer; font-family: var(--mono); font-size: 11px;
        letter-spacing: .08em; text-transform: uppercase;
      }
      .btn--lleno { background: var(--tinta); color: var(--papel); }
      .btn--senal { background: var(--senal); border-color: var(--senal); color: #fff; }
      .btn:disabled { opacity: .45; cursor: default; }
      .login {
        max-width: 420px; margin: 12vh auto; padding: 28px;
        border: 1px solid var(--linea); background: #fff;
      }
      .login h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.04em; }
      .login p { color: var(--grafito); font-size: 13px; }
      .campo { margin-top: 16px; }
      .campo > label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--grafito); margin-bottom: 6px; }
      .campo input[type='text'], .campo input[type='password'], .campo input[type='number'], .campo textarea {
        width: 100%; border: 1px solid var(--linea); background: #fff; padding: 10px; color: var(--tinta);
      }
      .campo textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
      .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 57px); }
      .menu { border-right: 1px solid var(--linea); padding: 18px 12px; position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow: auto; }
      .menu button {
        display: block; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: none;
        cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      }
      .menu button:hover { background: #eeece4; }
      .menu button.activo { background: var(--tinta); color: var(--papel); }
      .panel { padding: 26px clamp(16px, 3vw, 44px) 80px; max-width: 1000px; }
      .panel h2 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.04em; }
      .panel__nota { color: var(--grafito); font-size: 13px; margin: 0 0 20px; }
      fieldset { border: 1px solid var(--linea); margin: 16px 0; padding: 16px; }
      legend { padding: 0 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--senal); }
      .objeto { border-left: 2px solid var(--linea); padding-left: 14px; margin: 14px 0; }
      .lista { border: 1px dashed var(--linea); padding: 12px; margin: 12px 0; }
      .lista__item { border: 1px solid var(--linea); background: #fff; padding: 12px; margin: 10px 0; }
      .lista__acciones { display: flex; gap: 6px; margin-bottom: 8px; }
      .mini { padding: 4px 8px; font-size: 10px; }
      .fila { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
      .fila input[type='text'] { flex: 1; }
      .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
      .check label { font-family: var(--mono); font-size: 11px; }
      .subida { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
      .subida img { max-height: 64px; border: 1px solid var(--linea); background: #fff; }
      .subida code { font-size: 10px; color: var(--grafito); }
      .aviso { padding: 12px; border-left: 2px solid var(--senal); background: #f3e7e2; font-size: 13px; margin: 16px 0; }
      @media (max-width: 800px) {
        .layout { grid-template-columns: 1fr; }
        .menu { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--linea); display: flex; overflow-x: auto; gap: 4px; }
        .menu button { white-space: nowrap; width: auto; }
      }
    </style>
  </head>
  <body>
    <div id="login" class="login">
      <h1>Administración</h1>
      <p>Edita el contenido y publica los cambios en GitHub. La contraseña se valida en el Worker, no en esta página.</p>
      <div class="campo">
        <label for="api">URL del Worker</label>
        <input id="api" type="text" placeholder="https://portafolio-admin.tuusuario.workers.dev" />
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" />
      </div>
      <div class="campo">
        <button id="entrar" class="btn btn--lleno">Entrar</button>
      </div>
      <p id="login-error" class="aviso oculto"></p>
    </div>

    <div id="app" class="oculto">
      <header class="barra">
        <strong>Contenido</strong>
        <span id="estado" class="barra__estado">Sin cambios</span>
        <button id="guardar" class="btn btn--senal">Guardar y publicar</button>
        <button id="salir" class="btn">Salir</button>
      </header>
      <div class="layout">
        <nav id="menu" class="menu" aria-label="Secciones del contenido"></nav>
        <main id="panel" class="panel"></main>
      </div>
    </div>

    <script>
      const API_POR_DEFECTO = 'https://TU-WORKER.workers.dev';
      const $ = (selector) => document.querySelector(selector);
      const BASE = location.pathname.replace(/\/admin\/?.*$/, '/');

      const estado = {
        api: localStorage.getItem('admin_api') || API_POR_DEFECTO,
        token: localStorage.getItem('admin_token') || '',
        contenido: null,
        sha: '',
        activo: 'sitio',
        cambios: false,
      };

      const etiquetas = {
        sitio: 'Datos del sitio',
        secciones: 'Secciones',
        nav: 'Navegación',
        hero: 'Portada',
        cifras: 'Información general',
        contenido: 'Secciones de la página',
        footer: 'Pie de página',
      };

      const campo = (clave) =>
        clave
          .replace(/([a-z])([A-Z])/g, '$1 $2')
          .replace(/^./, (letra) => letra.toUpperCase())
          .replace(/_/g, ' ');

      const marcar = () => {
        estado.cambios = true;
        $('#estado').textContent = 'Cambios sin publicar';
      };

      const pedir = async (ruta, opciones = {}) => {
        const respuesta = await fetch(`${estado.api.replace(/\/$/, '')}${ruta}`, {
          ...opciones,
          headers: {
            ...(opciones.body instanceof FormData ? {} : { 'content-type': 'application/json' }),
            ...(estado.token ? { Authorization: `Bearer ${estado.token}` } : {}),
            ...(opciones.headers || {}),
          },
        });
        const datos = await respuesta.json().catch(() => ({}));
        if (!respuesta.ok) throw new Error(datos.error || `Error ${respuesta.status}`);
        return datos;
      };

      const textoLargo = (clave, valor) =>
        typeof valor === 'string' &&
        (valor.length > 90 || /<(p|br|em|strong|span)/i.test(valor) || /parrafo|detalle|nota|descripcion|legal|aviso|pregunta|titulo/i.test(clave));

      const esImagen = (ruta) => /\.(png|jpe?g|webp|avif|svg)$/i.test(ruta || '');

      const limpiar = (valor) => {
        if (Array.isArray(valor)) return [];
        if (valor && typeof valor === 'object') {
          return Object.fromEntries(Object.entries(valor).map(([clave, dato]) => [clave, limpiar(dato)]));
        }
        if (typeof valor === 'number') return 0;
        if (typeof valor === 'boolean') return false;
        return '';
      };

      const subir = async (archivo, destino, alTerminar) => {
        if (!archivo) return;
        if (archivo.size > 9 * 1024 * 1024) {
          alert('El archivo supera 9 MB. Usa un IFC más liviano o súbelo manualmente al repositorio.');
          return;
        }
        const nombre = prompt('Nombre del archivo (sin espacios):', archivo.name.replace(/\s+/g, '-'));
        if (!nombre) return;
        const limpio = nombre.toLowerCase().replace(/[^a-z0-9._-]/g, '-');
        const formulario = new FormData();
        formulario.append('file', archivo);
        formulario.append('destino', `public/${destino}/${limpio}`);
        formulario.append('mensaje', `Subir ${limpio} desde el panel`);
        try {
          const datos = await pedir('/upload', { method: 'POST', body: formulario });
          alTerminar(datos.ruta);
        } catch (error) {
          alert(error.message);
        }
      };

      const crearEntrada = (clave, valor, ruta, alCambiar) => {
        if (typeof valor === 'string') {
          const contenedor = document.createElement('div');
          contenedor.className = 'campo';
          const id = `c-${Math.random().toString(36).slice(2)}`;
          const label = document.createElement('label');
          label.htmlFor = id;
          label.textContent = campo(clave);
          const control = document.createElement(textoLargo(clave, valor) ? 'textarea' : 'input');
          control.id = id;
          if (control.tagName === 'INPUT') control.type = 'text';
          control.value = valor;
          control.addEventListener('input', () => {
            alCambiar(control.value);
            marcar();
          });
          contenedor.append(label, control);
          if (/foto|icono|archivo|imagen/i.test(clave)) {
            const subida = document.createElement('div');
            subida.className = 'subida';
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = /archivo/i.test(clave) ? '.ifc' : 'image/*';
            input.addEventListener('change', () => {
              const destino = /archivo/i.test(clave) ? 'modelos' : 'uploads';
              subir(input.files[0], destino, (nueva) => {
                control.value = nueva;
                alCambiar(nueva);
                marcar();
                if (esImagen(nueva)) {
                  vista.src = BASE + nueva;
                  vista.hidden = false;
                }
              });
            });
            const vista = document.createElement('img');
            vista.alt = '';
            vista.hidden = !esImagen(valor);
            if (esImagen(valor)) vista.src = BASE + valor;
            subida.append(input, vista);
            contenedor.append(subida);
          }
          return contenedor;
        }

        if (typeof valor === 'number') {
          const contenedor = document.createElement('div');
          contenedor.className = 'campo';
          const label = document.createElement('label');
          label.textContent = campo(clave);
          const control = document.createElement('input');
          control.type = 'number';
          control.value = String(valor);
          control.addEventListener('input', () => {
            alCambiar(Number(control.value));
            marcar();
          });
          contenedor.append(label, control);
          return contenedor;
        }

        if (typeof valor === 'boolean') {
          const contenedor = document.createElement('div');
          contenedor.className = 'check';
          const control = document.createElement('input');
          control.type = 'checkbox';
          control.checked = valor;
          control.id = `b-${Math.random().toString(36).slice(2)}`;
          control.addEventListener('change', () => {
            alCambiar(control.checked);
            marcar();
          });
          const label = document.createElement('label');
          label.htmlFor = control.id;
          label.textContent = campo(clave);
          contenedor.append(control, label);
          return contenedor;
        }

        if (Array.isArray(valor)) {
          const fieldset = document.createElement('fieldset');
          const legend = document.createElement('legend');
          legend.textContent = campo(clave);
          fieldset.append(legend);

          const lista = document.createElement('div');
          lista.className = 'lista';

          const pintar = () => {
            lista.textContent = '';
            valor.forEach((elemento, indice) => {
              if (typeof elemento === 'object' && elemento !== null) {
                const caja = document.createElement('div');
                caja.className = 'lista__item';
                const acciones = document.createElement('div');
                acciones.className = 'lista__acciones';
                const borrar = document.createElement('button');
                borrar.type = 'button';
                borrar.className = 'btn mini';
                borrar.textContent = 'Quitar';
                borrar.addEventListener('click', () => {
                  valor.splice(indice, 1);
                  alCambiar(valor);
                  marcar();
                  pintar();
                });
                const subirBtn = document.createElement('button');
                subirBtn.type = 'button';
                subirBtn.className = 'btn mini';
                subirBtn.textContent = '↑';
                subirBtn.disabled = indice === 0;
                subirBtn.addEventListener('click', () => {
                  [valor[indice - 1], valor[indice]] = [valor[indice], valor[indice - 1]];
                  alCambiar(valor);
                  marcar();
                  pintar();
                });
                acciones.append(borrar, subirBtn);
                caja.append(acciones);
                Object.keys(elemento).forEach((subclave) => {
                  caja.append(
                    crearEntrada(subclave, elemento[subclave], `${ruta}.${indice}.${subclave}`, (nuevo) => {
                      elemento[subclave] = nuevo;
                    }),
                  );
                });
                lista.append(caja);
              } else {
                const fila = document.createElement('div');
                fila.className = 'fila';
                const control = document.createElement('input');
                control.type = 'text';
                control.value = String(elemento);
                control.addEventListener('input', () => {
                  valor[indice] = control.value;
                  alCambiar(valor);
                  marcar();
                });
                const borrar = document.createElement('button');
                borrar.type = 'button';
                borrar.className = 'btn mini';
                borrar.textContent = '×';
                borrar.addEventListener('click', () => {
                  valor.splice(indice, 1);
                  alCambiar(valor);
                  marcar();
                  pintar();
                });
                fila.append(control, borrar);
                lista.append(fila);
              }
            });
          };

          pintar();
          const agregar = document.createElement('button');
          agregar.type = 'button';
          agregar.className = 'btn mini';
          agregar.textContent = 'Añadir';
          agregar.addEventListener('click', () => {
            const modelo = valor[0];
            valor.push(modelo && typeof modelo === 'object' ? limpiar(modelo) : '');
            alCambiar(valor);
            marcar();
            pintar();
          });
          fieldset.append(lista, agregar);
          return fieldset;
        }

        if (valor && typeof valor === 'object') {
          const fieldset = document.createElement('fieldset');
          const legend = document.createElement('legend');
          legend.textContent = campo(clave);
          fieldset.append(legend);
          Object.keys(valor).forEach((subclave) => {
            fieldset.append(
              crearEntrada(subclave, valor[subclave], `${ruta}.${subclave}`, (nuevo) => {
                valor[subclave] = nuevo;
              }),
            );
          });
          return fieldset;
        }

        return document.createElement('span');
      };

      const pintarPanel = () => {
        const panel = $('#panel');
        panel.textContent = '';
        const titulo = document.createElement('h2');
        titulo.textContent = etiquetas[estado.activo] || campo(estado.activo);
        const nota = document.createElement('p');
        nota.className = 'panel__nota';
        nota.textContent =
          'Los cambios se publican como un commit en GitHub; el sitio se reconstruye solo.';
        panel.append(titulo, nota);
        panel.append(
          crearEntrada(estado.activo, estado.contenido[estado.activo], estado.activo, (nuevo) => {
            estado.contenido[estado.activo] = nuevo;
          }),
        );
      };

      const pintarMenu = () => {
        const menu = $('#menu');
        menu.textContent = '';
        Object.keys(estado.contenido).forEach((clave) => {
          const boton = document.createElement('button');
          boton.type = 'button';
          boton.textContent = etiquetas[clave] || campo(clave);
          boton.classList.toggle('activo', clave === estado.activo);
          boton.addEventListener('click', () => {
            estado.activo = clave;
            pintarMenu();
            pintarPanel();
          });
          menu.append(boton);
        });
      };

      const cargarContenido = async () => {
        const datos = await pedir('/content');
        estado.contenido = datos.contenido;
        estado.sha = datos.sha;
        estado.cambios = false;
        $('#estado').textContent = 'Contenido cargado';
        $('#login').classList.add('oculto');
        $('#app').classList.remove('oculto');
        pintarMenu();
        pintarPanel();
      };

      $('#entrar').addEventListener('click', async () => {
        const api = $('#api').value.trim();
        const clave = $('#clave').value;
        if (!api || !clave) return;
        estado.api = api;
        localStorage.setItem('admin_api', api);
        try {
          const datos = await pedir('/login', {
            method: 'POST',
            body: JSON.stringify({ password: clave }),
          });
          estado.token = datos.token;
          localStorage.setItem('admin_token', datos.token);
          await cargarContenido();
        } catch (error) {
          const aviso = $('#login-error');
          aviso.textContent = error.message;
          aviso.classList.remove('oculto');
        }
      });

      $('#guardar').addEventListener('click', async () => {
        const boton = $('#guardar');
        boton.disabled = true;
        $('#estado').textContent = 'Publicando…';
        try {
          const datos = await pedir('/content', {
            method: 'PUT',
            body: JSON.stringify({
              contenido: estado.contenido,
              sha: estado.sha,
              mensaje: 'Actualizar contenido desde el panel',
            }),
          });
          estado.cambios = false;
          $('#estado').textContent = `Publicado · ${datos.commit?.slice(0, 7) ?? 'ok'}`;
          await cargarContenido();
        } catch (error) {
          $('#estado').textContent = error.message;
        } finally {
          boton.disabled = false;
        }
      });

      $('#salir').addEventListener('click', () => {
        localStorage.removeItem('admin_token');
        location.reload();
      });

      if (estado.token) {
        cargarContenido().catch(() => {
          localStorage.removeItem('admin_token');
          estado.token = '';
        });
      }
      $('#api').value = estado.api === API_POR_DEFECTO ? '' : estado.api;
    </script>
  </body>
</html>
